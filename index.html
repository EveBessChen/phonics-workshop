<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F0E7;--paper:#fff;--ink:#171922;--ink2:#4C4F5C;--ink3:#8B8E9B;
  --line:#E7E1D3;--terra:#C24E2E;--sage:#3E6B55;--gold:#B8862B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);min-height:100dvh;
  background:
    radial-gradient(900px 520px at 10% -10%, #FBE7DA 0%, rgba(251,231,218,0) 62%),
    radial-gradient(760px 460px at 94% 2%, #E7EFE8 0%, rgba(231,239,232,0) 58%),
    var(--bg);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:26px 18px calc(30px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(150deg,#22252F,#0F1116);
  color:#F7EFE0;display:grid;place-items:center;font-family:var(--serif);font-size:15px;letter-spacing:.05em;
  box-shadow:0 8px 18px -10px rgba(17,19,26,.9),inset 0 1px 0 rgba(255,255,255,.14);flex:0 0 auto}
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);font-weight:700}
h1{font-family:var(--serif);font-weight:500;font-size:21px;margin:3px 0 0;line-height:1.15}
.slogan{font-family:var(--serif);font-size:13px;color:var(--ink2);margin:6px 0 0;letter-spacing:.04em}
.lead{font-size:13px;color:var(--ink2);margin:0 0 16px;line-height:1.65}
.list{display:flex;flex-direction:column;gap:11px}
.card{display:flex;align-items:center;gap:12px;padding:15px 14px 15px 16px;background:var(--paper);
  border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:16px;text-decoration:none;
  color:var(--ink);box-shadow:0 6px 18px -14px rgba(23,25,34,.5);transition:transform .12s,box-shadow .12s}
.card:active{transform:scale(.985);box-shadow:0 3px 10px -8px rgba(23,25,34,.55)}
.emo{font-size:24px;line-height:1;flex:0 0 auto}
.txt{display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-width:0}
.nm{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.01em}
.mt{font-size:12px;color:var(--ink3);letter-spacing:.01em}
.go{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#fff;background:var(--ac);
  padding:7px 12px;border-radius:999px;white-space:nowrap}
.foot{margin-top:18px;font-size:11.5px;color:var(--ink3);line-height:1.8}
.foot b{color:var(--ink2);font-weight:600}
</style>

<div class="wrap">

    </a>
    <a class="card" href="grade4.html" style="--ac:#B8862B">

      </span>
      <span class="go">开始 →</span>

    <a class="card" href="grade5.html" style="--ac:#C24E2E">

</div>
<script>
(function(){
  var q = location.search || '';
  if(!q) return;
  document.querySelectorAll('a.card').forEach(function(a){

})();
