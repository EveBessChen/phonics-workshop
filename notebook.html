.row:active{transform:scale(.99)}

.cnt{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#fff;background:var(--terra);

.del{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);

.del:active{background:var(--terra);color:#fff;border-color:var(--terra)}
.empty{text-align:center;padding:34px 16px;color:var(--ink3);font-size:13px;line-height:1.8;

.empty .big{font-size:30px;display:block;margin-bottom:8px}
.foot{margin-top:18px;font-size:11.5px;color:var(--ink3);line-height:1.8}
.foot b{color:var(--ink2);font-weight:600}
.danger{margin-top:14px;width:100%;border:1px solid var(--line);background:var(--paper);

.toast{position:fixed;left:50%;transform:translateX(-50%);top:10px;background:#22252F;color:#F7EFE0;

.toast.show{opacity:.96}

var WMAP = {};
WORDS_MIN.forEach(function(x){ WMAP[x.g + '|' + x.w.toLowerCase()] = x; });

/* ============ 本地存档（存在这台设备的浏览器里，不上传） ============ */
var PW = (function(){
  var K = 'phonicsWorkshop_v1', d;
  try{ d = JSON.parse(localStorage.getItem(K)) || {}; }catch(e){ d = {}; }
  if(!d.data) d.data = {};
  if(!d.kid) d.kid = '我';
  function save(){ try{ localStorage.setItem(K, JSON.stringify(d)); }catch(e){} }
  function prof(){ if(!d.data[d.kid]) d.data[d.kid] = {}; return d.data[d.kid]; }
  function gr(g){
    var p = prof(), x = p[g];
    if(!x || typeof x !== 'object') x = p[g] = {};
    if(!x.w) x.w = {}; if(!x.r) x.r = {}; if(!x.d) x.d = {};
    if(typeof x.s !== 'number') x.s = 0;
    return x;
  }
  function today(){ var t = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()); }
  function day(g){ var x = gr(g), t = today(); if(!x.d[t]) x.d[t] = {s:0,r:0,w:0}; return x.d[t]; }
  return {
    today: today,
    wrong: function(g,w){ var x=gr(g); x.w[w]=(x.w[w]||0)+1; day(g).w++; save(); },
    right: function(g,w){ var x=gr(g); x.r[w]=(x.r[w]||0)+1; day(g).r++; save(); },
    star:  function(g){ var x=gr(g); x.s++; day(g).s++; save(); },
    grade: function(g){ return gr(g); },
    all:   function(){ return prof(); },
    delWrong:  function(g,w){ var x=gr(g); delete x.w[w]; save(); },
    clearGrade:function(g){ var x=gr(g); x.w={}; save(); },
    clearAll:  function(){ d.data = {}; save(); }
  };
})();
var GS = [{g:'g3',n:'三年级',f:'grade3.html'},{g:'g4',n:'四年级',f:'grade4.html'},{g:'g5',n:'五年级',f:'grade5.html'}];
function keepQuery(href){            /* 把 sharecode 等参数带到下一个页面 */
  var q = location.search || '';
  if(!q) return href;
  return href.indexOf('?') === -1 ? (href + q) : (href + '&' + q.slice(1));
}

var filter = 'all';

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
function collect(){
  var p = PW.all(), map = {};
  GS.forEach(function(o){
    var x = p[o.g]; if(!x || !x.w) return;
    Object.keys(x.w).forEach(function(w){
      var n = x.w[w]; if(!n) return;
      var k = o.g + '|' + w.toLowerCase();
      var info = WMAP[k];
      if(!map[k]) map[k] = { w:(info ? info.w : w), n:0, g:o.g, gn:o.n, f:o.f, keys:[],
                             zh:(info ? info.zh : ''), us:(info ? info.us : []) };
      map[k].n += n;
      map[k].keys.push(w);                       /* 同一个词大小写写过两次，删的时候一起删 */
      if(info) map[k].w = info.w;
    });
  });
  var out = Object.keys(map).map(function(k){ return map[k]; });
  out.sort(function(a,b){ return a.w.toLowerCase() < b.w.toLowerCase() ? -1 : 1; });   /* 按字母排序 */
  return out;
}
function counts(){
  var p = PW.all(), c = {all:0, g3:0, g4:0, g5:0}, seen = {};
  GS.forEach(function(o){
    var x = p[o.g]; if(!x || !x.w) return;
    Object.keys(x.w).forEach(function(w){
      if(!x.w[w]) return;
      var k = o.g + '|' + w.toLowerCase();
      if(seen[k]) return; seen[k] = 1;
      c[o.g]++; c.all++;
    });
  });
  return c;
}
function renderChips(){
  var c = counts(), box = document.getElementById('chips');
  box.innerHTML = '';
  var opts = [{k:'all',n:'全部'}].concat(GS.map(function(o){ return {k:o.g,n:o.n}; }));
  opts.forEach(function(o){
    var b = document.createElement('button');
    b.className = 'chip' + (filter === o.k ? ' on' : '');
    b.innerHTML = o.n + ' <span class="n">' + c[o.k] + '</span>';
    b.onclick = function(){ filter = o.k; renderChips(); renderList(); };
    box.appendChild(b);
  });
  document.getElementById('clearAll').style.display = c.all ? '' : 'none';   /* 空的时候不用显示清空 */
}
function renderList(){
  var all = collect();
  var rows = filter === 'all' ? all : all.filter(function(r){ return r.g === filter; });
  var list = document.getElementById('list'), empty = document.getElementById('empty');
  list.innerHTML = '';
  empty.hidden = rows.length > 0;
  if(!rows.length && filter === 'all') empty.innerHTML = '<span class="big">🌟</span>还没有错词。<br>玩「找一找」或「拼一拼」时拼错的词会自动出现在这里。';
  else if(!rows.length) empty.innerHTML = '<span class="big">🌟</span>这一年级还没有错词。';
  rows.forEach(function(r){
    var row = document.createElement('div');
    row.className = 'row';
    var unit = r.us && r.us.length ? ('Unit ' + r.us.join('/')) : '';
    row.innerHTML = '<span class="wd">' + r.w + '</span>' +
      (r.zh ? '<span class="zh">' + r.zh + '</span>' : '') +
      '<span class="meta">' + r.gn + (unit ? ' · ' + unit : '') + '</span>' +
      '<span class="cnt">错 ' + r.n + ' 次</span>' +
      '<button class="del" title="删除这个词">✕</button>';
    row.onclick = function(){ location.href = keepQuery(r.f + '?w=' + encodeURIComponent(r.w)); };
    row.querySelector('.del').onclick = function(e){
      e.stopPropagation();
      r.keys.forEach(function(k){ PW.delWrong(r.g, k); });
      renderChips(); renderList();
      toast('已删除：' + r.w);
    };
    list.appendChild(row);
  });
}
document.getElementById('clearAll').onclick = function(){
  if(!confirm('清空全部错词？拼错之后还会重新收集。')) return;
  GS.forEach(function(o){ PW.clearGrade(o.g); });
  renderChips(); renderList(); toast('错词本已清空');
};
renderChips(); renderList();
</script>
