<meta charset="utf-8">
<script>
/* 本机记录保险 v3
   目标：不管浏览器让不让存，记录都能读得到、写得上。
   1) 正常环境（Chrome / 线上链接 / 本地 .command 起的 http）：直接写 localStorage，关掉浏览器再开还在。
   2) 浏览器不许本地文件存东西（Safari 双击 html 就是这种）：
      数据改放在 window.name —— 这个标签页独有的一小块字符串，页面之间跳转不会丢；
      所以「玩完 → 错词本 / 学习报告 / 回首页」都看得到记录，关掉标签页才清空。
   3) 页面里的读写统一走 window.PWS，遇到抛错也会自动退到 window.name，不会白练。 */
(function(){
  var PROBE = '__pw_probe__', ok = false;
  try{
    localStorage.setItem(PROBE, '1');
    ok = localStorage.getItem(PROBE) === '1';
    localStorage.removeItem(PROBE);
  }catch(e){ ok = false; }

  var PREFIX = 'PWS1:';
  function load(){
    var raw = '';
    try{ raw = String(window.name || ''); }catch(e){ raw = ''; }
    if(raw.indexOf(PREFIX) !== 0) return {};
    try{ return JSON.parse(decodeURIComponent(raw.slice(PREFIX.length))) || {}; }catch(e){ return {}; }
  }
  var mem = load();
  function flush(){
    try{ window.name = PREFIX + encodeURIComponent(JSON.stringify(mem)); }catch(e){}
  }
  var store = {
    getItem: function(k){ k = String(k); return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
    setItem: function(k, v){ mem[String(k)] = String(v); flush(); },
    removeItem: function(k){ delete mem[String(k)]; flush(); },
    clear: function(){ mem = {}; flush(); },
    key: function(i){ var ks = Object.keys(mem); return i >= 0 && i < ks.length ? ks[i] : null; }
  };
  try{ Object.defineProperty(store, 'length', { get: function(){ return Object.keys(mem).length; } }); }catch(e){}

  /* 统一读写口：能用原生就用原生，用不了就退到 window.name */
  window.PWS = {
    available: ok,
    get: function(k){
      if(ok){ try{ return localStorage.getItem(k); }catch(e){} }
      return store.getItem(k);
    },
    set: function(k, v){
      if(ok){ try{ localStorage.setItem(k, v); return; }catch(e){} }
      store.setItem(k, v);
    },
    del: function(k){
      if(ok){ try{ localStorage.removeItem(k); }catch(e){} }
      store.removeItem(k);
    },
    raw: store
  };

  if(ok) return;
  window.PW_NO_PERSIST = true;

  /* 尽量把 localStorage / sessionStorage 这两个名字也换掉（换不掉也不影响，PWS 已经兜住） */
  ['localStorage','sessionStorage'].forEach(function(n){
    try{ Object.defineProperty(window, n, { configurable: true, get: function(){ return store; } }); }
    catch(e){ try{ window[n] = store; }catch(e2){} }
  });

  function banner(){
    var page = (location.pathname.split('/').pop() || 'index.html');
    if(page !== 'index.html' && page !== '' && page !== 'notebook.html' && page !== 'report.html') return;
    (function tryShow(){
      var veil = document.getElementById('veil');
      if(veil && veil.classList.contains('on')){ setTimeout(tryShow, 1200); return; }  /* 视频正在播，先不打扰 */
      if(store.getItem('pw_nb_seen') === '1') return;      /* 同一个标签页只提醒一次 */
      store.setItem('pw_nb_seen', '1');
      var d = document.createElement('div');
      d.id = 'pwNoStore';
      d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;max-width:520px;margin:0 auto;' +
        'background:#2B2118;color:#FBF3E6;font:13px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;' +
        'padding:12px 14px;border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.8);';
      d.innerHTML = '<b style="color:#FFD9A8">这台浏览器不许网页存记录</b>（一般是 Safari 直接双击文件打开）<br>' +
        '这次的错词和星星只在这个标签页里管用，关掉就没了。想长期保存，任选一种：<br>' +
        '① 双击文件夹里的 <b>打开拼读小工坊.command</b>；② 把 <b>index.html</b> 拖进 Chrome 打开。' +
        '<span id="pwNoStoreX" style="display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;' +
        'background:rgba(255,255,255,.14);cursor:pointer">知道了</span>';
      (document.body || document.documentElement).appendChild(d);
      var x = document.getElementById('pwNoStoreX');
      function bye(){ if(d.parentNode) d.parentNode.removeChild(d); }
      if(x) x.onclick = bye;
      setTimeout(bye, 14000);
    })();
  }
  /* 等一会儿再判断：首页可能正在自动播视频，别把提示条压在视频上 */
  function kick(){ setTimeout(banner, 1600); }
  if(document.body) kick();
  else document.addEventListener('DOMContentLoaded', kick);
})();
</script>

    if(!x || typeof x !== 'object') x = p[g] = {};
    if(!x.w) x.w = {}; if(!x.r) x.r = {}; if(!x.d) x.d = {};
    if(typeof x.s !== 'number') x.s = 0;
    return x;
  }
  function today(){ var t = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()); }
  function day(g){ var x = gr(g), t = today(); if(!x.d[t]) x.d[t] = {s:0,r:0,w:0}; return x.d[t]; }
  return {
    today: today,
    wrong: function(g,w){ var x=gr(g); x.w[w]=(x.w[w]||0)+1; day(g).w++; save(); },
    right: function(g,w){ var x=gr(g); x.r[w]=(x.r[w]||0)+1; day(g).r++; save(); },
    star:  function(g){ var x=gr(g); x.s++; day(g).s++; save(); },
    grade: function(g){ return gr(g); },
    all:   function(){ return prof(); },
    delWrong:  function(g,w){ var x=gr(g); delete x.w[w]; save(); },
    clearGrade:function(g){ var x=gr(g); x.w={}; save(); },
    clearAll:  function(){ d.data = {}; save(); }
  };
})();
var GS = [{g:'g3',n:'三年级',f:'grade3.html'},{g:'g4',n:'四年级',f:'grade4.html'},{g:'g5',n:'五年级',f:'grade5.html'}];
function keepQuery(href){            /* 把 sharecode 等参数带到下一个页面 */
  var q = location.search || '';
  if(!q) return href;
  return href.indexOf('?') === -1 ? (href + q) : (href + '&' + q.slice(1));
}

var AC = ['#3E6B55','#B8862B','#C24E2E'];
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
function ymd(dt){ var p = function(n){ return String(n).padStart(2,'0'); };
  return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate()); }
function lastDays(n){
  var out = [], t = new Date();
  for(var i=n-1;i>=0;i--){ var d = new Date(t.getTime() - i*86400000); out.push(ymd(d)); }
  return out;
}
function num(id, v){ document.getElementById(id).textContent = v; }

function totals(){
  var p = PW.all(), t = {star:0, right:0, wrong:0, know:0, wrongWords:0, days:{}};
  var seen = {};
  GS.forEach(function(o){
    var x = p[o.g]; if(!x) return;
    t.star += x.s || 0;
    if(x.r) Object.keys(x.r).forEach(function(w){ seen[o.g+'|'+w] = 1; });   /* 去重算"练过的词" */
    if(x.w) t.wrongWords += Object.keys(x.w).length;      /* 错词本里还剩几个（删掉就没了） */
    if(x.d) Object.keys(x.d).forEach(function(k){         /* 累计答错按每天的流水算，删错词不影响历史 */
      var v = x.d[k];
      if(!t.days[k]) t.days[k] = {s:0,r:0,w:0};
      t.days[k].s += v.s||0; t.days[k].r += v.r||0; t.days[k].w += v.w||0;
      t.right += v.r||0; t.wrong += v.w||0;
    });
  });
  t.know = Object.keys(seen).length;
  return t;
}
function render(){
  var t = totals(), today = PW.today();
  var d = t.days[today] || {s:0,r:0,w:0};
  num('dAll', d.r + d.w); num('dRight', d.r); num('dWrong', d.w); num('dStar', d.s);
  num('tStar', t.star); num('tKnow', t.know); num('tRight', t.right); num('tWrong', t.wrong);

  var t2 = new Date();
  document.getElementById('subDate').textContent = (t2.getMonth()+1) + '月' + t2.getDate() + '日 · 练过什么，都记在这里';

  /* 最近 7 天 */
  var days = lastDays(7), bars = document.getElementById('bars');
  bars.innerHTML = '';
  var max = 1;
  days.forEach(function(k){ var v = t.days[k]; var n = v ? (v.r + v.w) : 0; if(n > max) max = n; });
  days.forEach(function(k){
    var v = t.days[k], n = v ? (v.r + v.w) : 0;
    var el = document.createElement('div');
    el.className = 'bar' + (n ? '' : ' zero');
    el.innerHTML = '<i style="height:' + Math.round(n/max*72) + 'px"></i><b>' + k.slice(5).replace('-','/') + '</b>';
    bars.appendChild(el);
  });

  /* 各年级 */
  var p = PW.all(), box = document.getElementById('grades');
  box.innerHTML = '';
  GS.forEach(function(o, i){
    var x = p[o.g] || {};
    var know = x.r ? Object.keys(x.r).length : 0;
    var wn = 0;
    if(x.w){ var kw = {}; Object.keys(x.w).forEach(function(k){ if(x.w[k]) kw[k.toLowerCase()] = 1; }); wn = Object.keys(kw).length; }
    var el = document.createElement('div');
    el.className = 'gcard'; el.style.setProperty('--ac', AC[i]);
    el.innerHTML = '<span class="gname">' + o.n + '</span>' +
      '<span class="gnums"><span class="k">⭐ <b>' + (x.s||0) + '</b></span>' +
      '<span class="k">练过 <b>' + know + '</b> 词</span>' +
      '<span class="k">错词 <b>' + wn + '</b></span></span>' +
      '<a class="gobtn" href="' + keepQuery(o.f) + '">去练 →</a>';
    box.appendChild(el);
  });

  /* 打卡 */
  var keys = Object.keys(t.days).sort();
  num('days', keys.length);
  var streak = 0, ds = lastDays(400);
  for(var i = ds.length - 1; i >= 0; i--){
    var v = t.days[ds[i]];
    if(v && (v.r + v.w) > 0) streak++;
    else if(i !== ds.length - 1) break;
  }
  num('streak', streak);
}
document.getElementById('clearAll').onclick = function(){
  if(!confirm('清空这台设备上的全部学习记录？星星、错词本、打卡都会归零，不能恢复。')) return;
  PW.clearAll(); render(); toast('学习记录已清空');
};
render();
</script>
